name: Aktualizace kalendáře

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi beautifulsoup4
      - run: |
          mkdir -p public
          python sipky_to_ics.py --out public/lany.ics
          echo '<meta charset="utf-8"><title>Šipkaři Lány</title><p>Kalendář: <a href="lany.ics">lany.ics</a></p>' > public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
